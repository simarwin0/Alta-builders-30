<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1118" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alta Chat" />
    <link rel="icon" type="image/svg+xml" href="/alta-chat-icon.svg" />
    <link rel="apple-touch-icon" href="/alta-chat-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b1118; }
      .boot-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        color: #e8edf3;
        text-align: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1118;
      }
      .boot-screen img {
        display: block;
        width: 44px;
        height: 44px;
        margin: 0 auto;
        border-radius: 10px;
        filter: none;
      }
      .boot-screen h1 {
        margin: 14px 0 6px;
        color: #e8edf3;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -.025em;
      }
      .boot-screen p { margin: 0; color: #91a0ad; font-size: 13px; }
    </style>
    <meta name="description" content="Private, end-to-end encrypted messaging." />
    <title>Alta Chat — Private Messaging</title>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" role="status" aria-label="Loading Alta Chat">
        <div>
          <img src="/alta-chat-icon.svg" alt="" />
          <h1>Alta Chat</h1>
          <p>Opening your workspace…</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
